name: Build Patched Threads APK (LSPatch Non-Root)

on:
  workflow_dispatch:
    inputs:
      threads_apk_url:
        description: 'Direct download URL for official Threads APK (leave blank to auto-download official Threads APK)'
        required: false
        default: ''

jobs:
  patch-apk:
    name: Patch Threads APK with LSPatch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build ThreadsPulse Module APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate Threads APK URL
        id: get_url
        run: |
          URL="${{ github.event.inputs.threads_apk_url }}"
          if [ -z "$URL" ]; then
            URL="${{ secrets.THREADS_APK_URL }}"
          fi
          if [ -z "$URL" ]; then
            echo "No custom Threads APK URL provided. Using official Threads base APK mirror..."
            URL="https://pool.apk.aptoide.com/gs76/com-instagram-barcelona-512408677-77461354-d18c746fb311e383fa3ee8e380f8611d.apk"
          fi
          echo "Using APK URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download Base Threads APK
        run: |
          mkdir -p workspace
          curl -sL -o workspace/threads_base.apk "${{ steps.get_url.outputs.url }}"
          ls -lh workspace/threads_base.apk

      - name: Create Coexistence Clone Base APK
        run: |
          python scripts/patch_clone_manifest.py workspace/threads_base.apk workspace/threads_clone_base.apk
          ls -lh workspace/threads_clone_base.apk

      - name: Download LSPatch CLI
        run: |
          curl -sL -o workspace/lspatch.jar "https://github.com/LSPosed/LSPatch/releases/download/v0.5.1/lspatch.jar"
          ls -lh workspace/

      - name: Run LSPatch on Standard Threads APK
        run: |
          MODULE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Found module APK: $MODULE_APK"
          mkdir -p workspace/patched_std
          java -jar workspace/lspatch.jar workspace/threads_base.apk -m "$MODULE_APK" -k keystore/release.jks threadspulse threadspulse threadspulse -l 2 -o workspace/patched_std/
          ls -lh workspace/patched_std/

      - name: Run LSPatch on Coexistence Clone Threads APK
        run: |
          MODULE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p workspace/patched_clone
          java -jar workspace/lspatch.jar workspace/threads_clone_base.apk -m "$MODULE_APK" -k keystore/release.jks threadspulse threadspulse threadspulse -l 2 -o workspace/patched_clone/
          ls -lh workspace/patched_clone/

      - name: Prepare Final Output APKs & Verify Alignment
        run: |
          mkdir -p output
          cp workspace/patched_std/*-lspatched.apk output/Threads_Pulse_Patched.apk
          cp workspace/patched_clone/*-lspatched.apk output/Threads_Pulse_Clone_Coexist.apk
          cp app/build/outputs/apk/release/*.apk output/ThreadsPulse-Release.apk 2>/dev/null || true
          ls -lh output/
          python scripts/verify_apk_alignment.py output/Threads_Pulse_Patched.apk output/Threads_Pulse_Clone_Coexist.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Threads_Pulse_APKs
          path: output/*.apk
          if-no-files-found: error

      - name: Attach Patched APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.27.0
          files: |
            output/Threads_Pulse_Patched.apk
            output/Threads_Pulse_Clone_Coexist.apk
            output/ThreadsPulse-Release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
