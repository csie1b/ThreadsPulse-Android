name: Build Patched Threads APK (LSPatch Non-Root)

on:
  workflow_dispatch:
    inputs:
      threads_apk_url:
        description: 'Direct download URL for official Threads APK (leave blank to auto-download official Threads APK)'
        required: false
        default: ''

jobs:
  patch-apk:
    name: Patch Threads APK with LSPatch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build ThreadsPulse Module APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate Threads APK URL
        id: get_url
        run: |
          URL="${{ github.event.inputs.threads_apk_url }}"
          if [ -z "$URL" ]; then
            URL="${{ secrets.THREADS_APK_URL }}"
          fi
          if [ -z "$URL" ]; then
            echo "No custom Threads APK URL provided. Using official Threads base APK mirror..."
            URL="https://pool.apk.aptoide.com/gs76/com-instagram-barcelona-512408677-77461354-d18c746fb311e383fa3ee8e380f8611d.apk"
          fi
          echo "Using APK URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Download Base Threads APK
        run: |
          mkdir -p workspace
          curl -sL -o workspace/threads_base.apk "${{ steps.get_url.outputs.url }}"
          ls -lh workspace/threads_base.apk

      - name: Download LSPatch CLI
        run: |
          LSPATCH_JAR="workspace/lspatch.jar"
          curl -sL -o "$LSPATCH_JAR" "https://github.com/LSPosed/LSPatch/releases/download/v0.5.1/lspatch.jar"
          ls -lh workspace/

      - name: Run LSPatch Embedding
        run: |
          MODULE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Found module APK: $MODULE_APK"
          java -jar workspace/lspatch.jar workspace/threads_base.apk -m "$MODULE_APK" -l 2 -o workspace/patched/
          ls -lh workspace/patched/

      - name: Sign Patched APK with Uber-APK-Signer
        run: |
          curl -sL -o workspace/uber-apk-signer.jar "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          java -jar workspace/uber-apk-signer.jar --apks workspace/patched/ --allowResign --overwrite
          mkdir -p output
          cp workspace/patched/*-aligned-debugSigned.apk output/Threads_Pulse_Patched.apk 2>/dev/null || cp workspace/patched/*.apk output/Threads_Pulse_Patched.apk
          ls -lh output/

      - name: Upload Patched Threads APK
        uses: actions/upload-artifact@v4
        with:
          name: Threads_Pulse_Patched_APK
          path: output/Threads_Pulse_Patched.apk
          if-no-files-found: error
